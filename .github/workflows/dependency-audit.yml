name: Dependency audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails on high/critical production advisories not on the reviewed
      # allowlist in scripts/audit-check.mjs (each entry documents why).
      - run: node scripts/audit-check.mjs
