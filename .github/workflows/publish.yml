name: Publish

# Publishes @formatic-labs/qbo-mcp to GitHub Packages when a version tag is pushed
# (e.g. v0.1.0). Humans never run `npm publish` by hand. Pipeline shape follows
# GitHub-Packages-Playbook.md section 3.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@formatic-labs'
      - run: npm ci
      # Fail unless the tag matches package.json (v + version).
      - name: Check tag matches package version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version v$VERSION" >&2
            exit 1
          fi
      - run: npm run lint
      # `pretest` runs the build, so this also type-checks and builds dist/.
      - run: npm test
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
